<div class="fixed top-4 right-4 z-50 space-y-2 w-80">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-start gap-3 px-4 py-3 rounded-xl shadow-2xl border bg-slate-900 backdrop-blur-xl transition-all animate-in slide-in-from-right-4"
      [class.border-emerald-500\/50]="toast.type === 'success'"
      [class.border-red-500\/50]="toast.type === 'error'"
    >
      <div
        class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5"
        [class.bg-emerald-500\/20]="toast.type === 'success'"
        [class.bg-red-500\/20]="toast.type === 'error'"
      >
        @if (toast.type === 'success') {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </div>
      <p class="text-sm text-slate-200 flex-1 font-medium leading-tight">{{ toast.message }}</p>
      <button (click)="toastService.dismiss(toast.id)" class="text-slate-500 hover:text-slate-300 flex-shrink-0 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
